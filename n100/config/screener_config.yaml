# Nifty 100 Screener Engine Configuration

preset_screeners:
  Quality Compounder:
    description: "High ROE, low leverage, positive cash generation, solid revenue growth."
    filters:
      min_roe: 15.0
      max_de: 1.0
      min_fcf: 0.0
      min_revenue_cagr_5yr: 10.0

  Value Pick:
    description: "Fair valuation multiples with reasonable leverage and dividend yield."
    filters:
      max_pe: 35.0
      max_pb: 5.0
      max_de: 2.0
      min_dividend_yield: 0.5

  Growth Accelerator:
    description: "Rapid profit and revenue growth over 5-year period with manageable debt."
    filters:
      min_pat_cagr_5yr: 20.0
      min_revenue_cagr_5yr: 15.0
      max_de: 2.0

  Dividend Champion:
    description: "Above-average dividend yield with sustainable payout ratio and positive FCF."
    filters:
      min_dividend_yield: 2.0
      max_dividend_payout: 80.0
      min_fcf: 0.0

  Debt-Free Blue Chip:
    description: "Zero-debt companies with high profitability and strong scale."
    filters:
      max_de: 0.0
      min_roe: 12.0
      min_sales: 5000.0

  Turnaround Watch:
    description: "Improving 3Y revenue growth with positive free cash flow and safe leverage."
    filters:
      min_revenue_cagr_3yr: 10.0
      min_fcf: 0.0
      max_de: 2.0

composite_score_weights:
  profitability:
    weight: 0.35
    metrics:
      return_on_equity_pct: 0.15
      return_on_capital_employed_pct: 0.10
      net_profit_margin_pct: 0.10
  cash_quality:
    weight: 0.30
    metrics:
      free_cash_flow_cr: 0.15
      cfo_pat_ratio: 0.10
      fcf_positive_flag: 0.05
  growth:
    weight: 0.20
    metrics:
      revenue_cagr_5yr: 0.10
      pat_cagr_5yr: 0.10
  leverage:
    weight: 0.15
    metrics:
      debt_to_equity: 0.10
      interest_coverage: 0.05
